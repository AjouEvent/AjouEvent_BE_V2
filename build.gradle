plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
}

ext {
    set('springCloudVersion', '2025.1.1')
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'AjouEvent_BE_V2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Lombok
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'

    // Auth
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // Firebase
    implementation 'com.google.firebase:firebase-admin:9.4.0'

    // AWS S3
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.765'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // ShedLock
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.3.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.3.0'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 로컬 실행 시 .env 파일을 자동으로 환경변수로 주입
// Docker Compose는 .env를 자동 로드하지만 ./gradlew bootRun은 그렇지 않으므로 명시적으로 처리
tasks.named('bootRun') {
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (!trimmed.startsWith('#') && trimmed.contains('=')) {
                def idx = trimmed.indexOf('=')
                def key = trimmed.substring(0, idx).trim()
                def value = trimmed.substring(idx + 1).trim()
                environment(key, value)
            }
        }
    }
}

spotless {
    java {
        target('src/**/*.java')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    json {
        target('src/**/*.json', '.claude/**/*.json')
        gson()
            .indentWithSpaces(2)
            .sortByKeys()
        trimTrailingWhitespace()
        endWithNewline()
    }

    yaml {
        target('src/**/*.yaml', 'src/**/*.yml')
        trimTrailingWhitespace()
        endWithNewline()
    }

    format('markdown') {
        target('*.md', '.claude/**/*.md')
        trimTrailingWhitespace()
        endWithNewline()
    }

    format('misc') {
        target('src/**/*.properties', 'src/**/*.xml', 'src/**/*.sql', 'src/**/*.sh')
        trimTrailingWhitespace()
        endWithNewline()
    }
}
