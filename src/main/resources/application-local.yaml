spring:
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

ajou:
  swagger:
    server-url: http://localhost:8080
  fcm:
    executor:
      max-in-flight-batches: 3
      callback:
        core-pool-size: 4
        max-pool-size: 4
        queue-capacity: 100
        await-termination-seconds: 30
      default-pool:
        core-pool-size: 200
        max-pool-size: 200
        queue-capacity: 2000
      dispatch:
        core-pool-size: 2
        max-pool-size: 2
        queue-capacity: 100

jwt:
  cookie-secure: false
