server:
  tomcat:
    mbean-registry:
      enabled: true

spring:
  application:
    name: ajouevent-be-v2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  config:
    import:
      - classpath:config/db.yaml
      - classpath:config/oauth.yaml
      - classpath:config/jwt.yaml
      - classpath:config/fcm.yaml
      - classpath:config/discord.yaml
      - classpath:config/aws.yaml
      - classpath:config/google.yaml

management:
  server:
    # 앱 포트(8080)와 분리 — Spring Security SecurityFilterChain 밖에서 동작하므로
    # SecurityConfig 수정 없이 AWS 보안 그룹으로만 접근 제어 가능
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 모든 메트릭에 공통 태그로 부착 — 멀티 앱 환경에서 Prometheus 쿼리 시 앱 구분자 역할
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 히스토그램 버킷 활성화 — Prometheus에서 histogram_quantile()로 정확한 레이턴시 분위수 계산 가능
        # 비활성화 시 percentiles 값은 앱 내부 추정값(부정확)으로만 노출됨
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

ajou:
  scheduler:
    pool-size: 4
    await-termination-seconds: 30
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  push:
    stale-threshold-minutes: 10
    max-retry-count: 3
