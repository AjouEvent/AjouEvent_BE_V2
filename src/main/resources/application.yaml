spring:
  application:
    name: ajouevent-be-v2
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  config:
    import:
      - classpath:config/db.yaml
      - classpath:config/oauth.yaml
      - classpath:config/jwt.yaml
      - classpath:config/fcm.yaml
      - classpath:config/discord.yaml
      - classpath:config/aws.yaml
      - classpath:config/google.yaml

ajou:
  swagger:
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  push:
    stale-threshold-minutes: 10
    max-retry-count: 3
