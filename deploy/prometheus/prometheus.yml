global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: ajouevent-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ajouevent-app:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - ajouevent-cadvisor:8080

  - job_name: node
    static_configs:
      - targets:
          - 10.0.0.170:9100
