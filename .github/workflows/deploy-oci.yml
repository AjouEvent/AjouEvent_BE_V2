name: Deploy to OCI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set image name
        id: meta
        run: echo "image=ghcr.io/ajouevent/ajouevent-be:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # 운영 서버(A1)는 arm64. Gradle 빌드는 BUILDPLATFORM 에서 한 번만 돌고, 런타임 단계만 아키텍처별로 만든다
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # GitHub Container Registry (조직 패키지, 공개). 별도 계정 시크릿 없이 GITHUB_TOKEN 으로 push 한다
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Firebase 키는 이미지에 넣지 않는다. 운영 서버가 OCI Vault(ajouevent-firebase-sa)에서 받아 마운트한다
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          cache-from: type=gha,scope=ajouevent-be
          cache-to: type=gha,scope=ajouevent-be,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/AjouEvent/AjouEvent_BE_V2
          tags: |
            ghcr.io/ajouevent/ajouevent-be:latest
            ${{ steps.meta.outputs.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy deploy files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_DEPLOY_KEY }}
          source: deploy/docker-compose.yml,deploy/caddy,deploy/prometheus,deploy/loki,deploy/scripts
          target: ~/ajouevent
          strip_components: 1

      - name: Copy Grafana provisioning
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_DEPLOY_KEY }}
          source: monitoring/grafana
          target: ~/ajouevent
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKER_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_DEPLOY_KEY }}
          command_timeout: 15m
          envs: DOCKER_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/ajouevent
            export DOCKER_IMAGE
            # 패키지가 비공개여도 받을 수 있게 이번 작업의 토큰으로만 잠시 로그인한다
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            docker pull "$DOCKER_IMAGE"
            docker logout ghcr.io >/dev/null
            rm -f Caddyfile
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            curl -s -X POST http://127.0.0.1:9091/-/reload || true
            for i in $(seq 1 36); do
              if docker compose exec -T app wget -qO- http://localhost:9090/actuator/health >/dev/null 2>&1; then echo "app healthy"; break; fi
              sleep 5
            done
            docker compose exec -T app wget -qO- http://localhost:9090/actuator/health
            docker image prune -f
