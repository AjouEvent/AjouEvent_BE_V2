services:
  app:
    build: .
    container_name: ajouevent-app
    restart: always
    env_file:
      - .env
    environment:
      REDIS_HOST: ajouevent-redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ajouevent-network

  redis:
    image: redis:7-alpine
    container_name: ajouevent-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - ajouevent-network

volumes:
  redis_data:
    driver: local

networks:
  ajouevent-network:
    driver: bridge
